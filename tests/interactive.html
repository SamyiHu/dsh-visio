<!doctype html>
<!--
  dsh-visio interaction harness.

  Runs the REAL client.js (the panel component) inside a real browser so pointer
  gestures can be asserted end to end. Two modes:

    fixture mode (default): a fake fetch replays tests/fixtures/*.json, so the
      layout can be inspected without Python:
        node tests/make_uicheck.mjs && python -m http.server 8932
        http://127.0.0.1:8932/tests/interactive.html?fixture=connector-state.json

    live mode: the page talks to the real engine through tests/serve_engine.py:
        python tests/make_fixture.py
        python tests/serve_engine.py 8933
        http://127.0.0.1:8933/_harness.html?live=1&spec=1
      ?spec=1 runs window.runSpec(): the assertions the panel must satisfy
      (handles appear, the line and the dots slide a run without moving an end,
      a dragged end re-glues to the shape under the cursor, and the zoom bar
      never covers a handle). The result lands in window.__SPEC__ and in the
      overlay; every entry must be PASS.
-->
<html><head><meta charset="utf-8"><title>dsh-visio interactive harness</title>
<style>html,body{margin:0;height:100%;font:13px system-ui,sans-serif}
#root{height:100vh;display:flex;flex-direction:column}
#root>*{flex:1;min-height:0}
#log{position:fixed;right:8px;bottom:8px;max-width:420px;max-height:40vh;overflow:auto;
 background:#1119;color:#eee;font:11px/1.45 ui-monospace,monospace;padding:6px;border-radius:6px;z-index:9}
</style>
<script src="/tests/vendor/react.production.min.js"></script>
<script src="/tests/vendor/react-dom.production.min.js"></script>
<script>
window.__OPS__ = []
window.__LOGS__ = []
window.__docState__ = null
window.__ModuleLoader__ = { load(module) { window.__VISIO_MODULE__ = module } }
function logLine(s) { window.__LOGS__.push(s); const el = document.getElementById('log'); if (el) el.textContent = window.__LOGS__.slice(-14).join('\n') }

async function fixture() {
  const which = new URLSearchParams(location.search).get('fixture') || 'demo-state.json'
  const res = await fetch('/tests/fixtures/' + which)
  return await res.json()
}

const LIVE = new URLSearchParams(location.search).get('live') === '1'
const LIVE_DOC = new URLSearchParams(location.search).get('doc') || 'tests/fixtures/_live.vsdx'

window.harnessBoot = async function boot() {
  if (LIVE) {
    window.__OPS__ = []
    const realFetch = window.fetch.bind(window)
    window.fetch = async (url, init) => {
      if (String(url).includes('/dsh-visio/op') && init && init.body) {
        try { window.__OPS__.push(JSON.parse(init.body)) } catch (e) { /* ignore */ }
      }
      const res = await realFetch(url, init)
      // The spec needs the state the panel is actually rendering (ports, pageSize)
      if (String(url).includes('/dsh-visio/op')) {
        try {
          const copy = res.clone()
          const json = await copy.json()
          if (json && json.shapes) window.__STATE__ = json
        } catch (e) { /* ignore */ }
      }
      return res
    }
    try {
      window.localStorage.setItem('dshv:lastDoc', LIVE_DOC)
      window.localStorage.setItem('dsh-visio.folder', 'tests/fixtures')
    } catch (e) { logLine('ls fail ' + e.message) }
    const mod0 = window.__VISIO_MODULE__
    const plugin0 = mod0.factory((id) => { if (id === 'react') return window.React; throw new Error('require ' + id) })
    let captured0 = null
    let dict0 = {}
    const ctx0 = {
      effect(fn) { const d = fn(); return typeof d === 'function' ? d : () => {} },
      get() { return undefined },
      inject() {},
      logger() { return { warn: logLine } },
      locale: {
        // keep the dictionary the plugin registers so the harness shows real text
        // (and a missing key is visible instead of silently looking fine)
        register(_ns, tables) { dict0 = (tables && tables.zh) || {}; return () => {} },
        bind() { return (key, params) => { let s = dict0[key] || key; for (const [k, v] of Object.entries(params || {})) s = s.split('{' + k + '}').join(String(v)); return s } },
      },
      slots: {
        inject(_n, cb) { cb() },
        register(spec, component) { if (spec.name === 'main') captured0 = component; return () => {} },
      },
    }
    plugin0.apply(ctx0)
    const root0 = window.ReactDOM.createRoot(document.getElementById('root'))
    root0.render(window.React.createElement(captured0, { t: ctx0.locale.bind(), pickFolder: async () => null }))
    await new Promise((res) => setTimeout(res, 1200))
    logLine('booted (live) ' + LIVE_DOC)
    return true
  }
  const fx = await fixture()
  const state = JSON.parse(JSON.stringify(fx.state))
  state.detail = null
  let selectedId = null

  const reply = (body) => {
    const action = body.action
    const withDetail = (id) => {
      const st = JSON.parse(JSON.stringify(state))
      st.detail = id && fx.details[id] ? JSON.parse(JSON.stringify(fx.details[id])) : null
      return st
    }
    if (action === 'list') return { ok: true, dir: 'C:/fixture', files: [{ name: 'demo.vsdx', path: state.path, size: 1024 }] }
    if (action === 'stat') return { ok: true, mtime: state.mtime }
    if (action === 'render') return withDetail(body.selected)
    if (action === 'open') return withDetail(body.selected)
    if (action === 'reglue' || action === 'move_segment') {
      return { ...withDetail(body.shape_id), notice: action + ' ok' }
    }
    return withDetail(body.shape_id)
  }

  window.fetch = async (url, init) => {
    const path = String(url)
    if (path.endsWith('/dsh-visio/config')) {
      return new Response(JSON.stringify({ ok: true, defaultFolder: 'C:/fixture', folderOk: true, python: 'python', pythonOk: true, engine: 'visio_bridge/1.0.0' }), { status: 200, headers: { 'content-type': 'application/json' } })
    }
    if (path.endsWith('/dsh-visio/op')) {
      const body = JSON.parse(init.body)
      window.__OPS__.push(body)
      logLine('op ' + body.action + (body.end ? ' end=' + body.end : '') + (body.to ? ' to=' + body.to : '') + (body.delta !== undefined ? ' delta=' + body.delta : '') + (body.index !== undefined ? ' index=' + body.index : ''))
      const payload = reply(body)
      if (body.action === 'render' && body.selected) {
        window.__docState__ = payload
      }
      return new Response(JSON.stringify(payload), { status: 200, headers: { 'content-type': 'application/json' } })
    }
    throw new Error('unexpected fetch ' + path)
  }

  const mod = window.__VISIO_MODULE__
  let captured = null
  const ctx = {
    effect(fn) { const d = fn(); return typeof d === 'function' ? d : () => {} },
    get() { return undefined },
    inject() {},
    logger() { return { warn: logLine } },
    locale: {
      register() { return () => {} },
      bind() { return (key, params) => { const zh = plugin.zh || {}; let s = zh[key] || key; for (const [k, v] of Object.entries(params || {})) s = s.split('{' + k + '}').join(String(v)); return s } },
    },
    slots: {
      inject(_n, cb) { cb() },
      register(spec, component) { if (spec.name === 'main') captured = component; return () => {} },
    },
  }
  try { window.localStorage.setItem('dshv:lastDoc', state.path); window.localStorage.setItem('dsh-visio.folder', 'C:/fixture') } catch (e) { logLine('ls fail ' + e.message) }
  const plugin = mod.factory((id) => { if (id === 'react') return window.React; throw new Error('require ' + id) })
  plugin.apply(ctx)
  const React = window.React
  const ReactDOM = window.ReactDOM
  const root = ReactDOM.createRoot(document.getElementById('root'))
  root.render(React.createElement(captured, { t: ctx.locale.bind(), pickFolder: async () => null }))
  await new Promise((r) => setTimeout(r, 400))
  logLine('booted')
  return true
}

window.runSpec = async function runSpec() {
  const results = []
  const check = (name, ok, detail) => { results.push({ name, ok: !!ok, detail: String(detail) }); return ok }
  const pathOf = () => {
    const el = document.querySelector('[data-shape-id="5"] path')
    return el ? el.getAttribute('d') : ''
  }
  const endpoints = (d) => {
    const nums = (d.match(/-?\d+\.?\d*/g) || []).map(Number)
    if (!nums.length) return null
    return { first: [nums[0], nums[1]], last: [nums[nums.length - 2], nums[nums.length - 1]] }
  }
  const waitOp = async (action, ms = 2500) => {
    const start = Date.now()
    while (Date.now() - start < ms) {
      if (window.__OPS__.some((o) => o.action === action)) return true
      await new Promise((r) => setTimeout(r, 100))
    }
    return false
  }
  const lastOp = (action) => window.__OPS__.filter((o) => o.action === action).slice(-1)[0]

  try {
    // The spec runs against a fixture or a live document, so pick the connector
    // that actually has a polyline instead of hard-coding a fixture id.
    const connectorId = () => {
      const st = window.__STATE__
      if (st && st.shapes) {
        // The spec must pick a connector that is actually on screen: a real drawing
        // can hold connectors whose endpoints sit outside the page, and a handle
        // drawn off-page cannot be clicked (elementFromPoint returns the sidebar).
        const size = st.pageSize || { w: 11, h: 8.5 }
        // Judge by the polyline, not by bbox: a hand-drawn route can sit outside
        // the page while Begin/End (which the bbox uses) are still inside, and
        // such a connector has no clickable handle.
        const onPage = (s) => (s.points || []).length >= 2
          && s.points.every((p) => p[0] >= -0.001 && p[1] >= -0.001
            && p[0] <= size.w + 0.001 && p[1] <= size.h + 0.001)
        const conns = st.shapes.filter((s) => s.connector && onPage(s))
        const withRoute = conns.filter((s) => s.points && s.points.length >= 3)
        if (withRoute.length) return withRoute[0].id
        if (conns.length) return conns[0].id
      }
      return '5'
    }
    const CONN = connectorId()
    const targetShape = () => {
      const st = window.__STATE__
      const conn = st && st.shapes && st.shapes.find((s) => s.id === CONN)
      const others = (st && st.shapes || []).filter((s) => !s.connector && s.id !== CONN)
      const used = new Set((conn && conn.connects || []).map((c) => String(c.to)))
      const free = others.filter((s) => !used.has(s.id))
      return (free[0] || others[0] || { id: '4' }).id
    }
    const OTHER = targetShape()

    // ---- 1. selecting a connector shows handles ---------------------------
    await window.harness.clickShape(CONN)
    await new Promise((r) => setTimeout(r, 600))
    const counts = window.harness.counts()
    check('handles: two ends, one band, one dot', counts.ends === 2 && counts.bands >= 1 && counts.dots >= 1,
      JSON.stringify({ ...counts, CONN }))

    // ---- 2. dragging the line itself slides that run ----------------------
    const before = pathOf()
    const band = document.querySelector('[data-route-band]').getBoundingClientRect()
    // On a short run the two end handles plus the blue dot cover the whole grab
    // band, so sample the middle: whichever of them takes the press, the gesture
    // must still be a segment move.
    const point = { x: band.left + band.width / 2, y: band.top }
    const hit = window.harness.hitAt(point.x, point.y)
    const bandEl = document.querySelector('[data-route-band]')
    check('band is hit-testable (pointer-events=stroke)',
      bandEl.getAttribute('pointer-events') === 'stroke',
      JSON.stringify({ attr: bandEl.getAttribute('pointer-events'), tag: hit.tag }))
    window.harness.clearOps()
    const probe = window.harness.dragProbe(point.x, point.y, point.x, point.y - 40, 6)
    check('band drag shows a live offset tooltip', probe.tips[probe.tips.length - 1] && probe.tips[probe.tips.length - 1].display === 'block',
      JSON.stringify(probe.tips[0]))
    const moved = await waitOp('move_segment')
    check('band drag commits move_segment', moved, JSON.stringify(window.__OPS__.slice(-1)))
    const op = lastOp('move_segment')
    check('band drag names the connector (not null)', op && op.shape_id === CONN, op && String(op.shape_id))
    await new Promise((r) => setTimeout(r, 400))
    const afterBand = pathOf()
    const e0 = endpoints(before)
    const e1 = endpoints(afterBand)
    const same = e0 && e1 && Math.abs(e0.first[0] - e1.first[0]) < 0.02 && Math.abs(e0.first[1] - e1.first[1]) < 0.02
      && Math.abs(e0.last[0] - e1.last[0]) < 0.02 && Math.abs(e0.last[1] - e1.last[1]) < 0.02
    check('band drag leaves both ends where they were', same, before + ' -> ' + afterBand)

    // ---- 3. the blue dot does the same -----------------------------------
    await window.harness.clickShape(CONN)
    await new Promise((r) => setTimeout(r, 600))
    const dot = document.querySelector('[data-route-handle]').getBoundingClientRect()
    const dp = { x: dot.left + dot.width / 2, y: dot.top + dot.height / 2 }
    const beforeDot = pathOf()
    window.harness.clearOps()
    const dotProbe = window.harness.dragProbe(dp.x, dp.y, dp.x, dp.y - 30, 5)
    check('dot drag shows a live offset tooltip',
      dotProbe.tips.some((tp) => tp && tp.display === 'block'),
      JSON.stringify(dotProbe.tips[dotProbe.tips.length - 1]))
    await new Promise((r) => setTimeout(r, 400))
    const e2 = endpoints(pathOf())
    const e3 = endpoints(beforeDot)
    const same2 = e2 && e3 && Math.abs(e2.first[0] - e3.first[0]) < 0.02 && Math.abs(e2.first[1] - e3.first[1]) < 0.02
      && Math.abs(e2.last[0] - e3.last[0]) < 0.02 && Math.abs(e2.last[1] - e3.last[1]) < 0.02
    check('dot drag leaves both ends where they were', same2, beforeDot + ' -> ' + pathOf())

    // ---- 4. dragging a red end re-glues it to the shape under the cursor --
    // The earlier gestures reshaped this connector; put it back on the router so
    // the end handles sit on predictable ports.
    await window.harness.resetRoute(CONN)
    await window.harness.clickShape(CONN)
    await new Promise((r) => setTimeout(r, 600))
    const endBox = window.harness.centreOf('[data-route-end]', 1)
    const targetRect = document.querySelector('[data-shape-id="' + OTHER + '"]').getBoundingClientRect()
    const target = { x: targetRect.left + targetRect.width / 2, y: targetRect.top + 2 }
    window.harness.clearOps()
    const endProbe = window.harness.dragProbe(endBox.x, endBox.y, target.x, target.y, 8)
    const named = endProbe.tips[endProbe.tips.length - 1] && endProbe.tips[endProbe.tips.length - 1].text
    check('end drag preview names the target shape', new RegExp('#' + OTHER).test(named || ''), named)
    const glued = await waitOp('reglue')
    check('end drag commits reglue', glued, JSON.stringify(window.__OPS__.slice(-1)))
    const glueOp = lastOp('reglue')
    check('reglue targets the shape under the cursor', glueOp && glueOp.to === OTHER, glueOp && String(glueOp.to))
    await new Promise((r) => setTimeout(r, 600))
    const after = window.harness.centreOf('[data-route-end]', 1)
    const shape4 = document.querySelector('[data-shape-id="' + OTHER + '"]').getBoundingClientRect()
    const near = after && Math.abs(after.x - (shape4.left + shape4.width / 2)) < 6 && Math.abs(after.y - shape4.top) < 12
    check('the re-glued end sits on the target edge', near,
      JSON.stringify({ end: after, shape: { left: shape4.left, top: shape4.top, w: shape4.width } }))

    // ---- 4b. what the green drop marker promises must be where the end lands --
    // The marker used to be drawn through a second, viewBox-based transform, so it
    // pointed at a port 0.25in away from the one the drop actually glued to.
    const markerDrop = await window.harness.markerDrop(CONN, 1, OTHER, 0)
    check('drop marker sits on the port the drop will use', markerDrop.markerMatchesCommit,
      JSON.stringify(markerDrop))
    check('the committed end lands exactly where the marker pointed', markerDrop.landedOnMarker,
      JSON.stringify({ landed: markerDrop.landed, marker: markerDrop.marker, sheet: markerDrop.committed }))

    // ---- 6. a line is a 1-D shape, not a box with a diagonal ----------------
    const svg6 = window.harness.svg()
    const vb6 = svg6.viewBox.baseVal
    const box6 = svg6.getBoundingClientRect()
    const scale6 = box6.width / vb6.width
    const pageH6 = window.harness.pageH()
    const px6 = (sx, sy) => ({ x: box6.left + (sx - vb6.x) * scale6, y: box6.top + ((pageH6 - sy) - vb6.y) * scale6 })
    const kindBtns = Array.from(document.querySelectorAll('.dshv-kind'))
    kindBtns[kindBtns.length - 1].click()
    await new Promise((r) => setTimeout(r, 200))
    window.harness.clearOps()
    {
      const a = px6(1.2, 2.2)
      const b = px6(4.6, 2.2)
      const hit = document.elementFromPoint(a.x, a.y)
      hit.dispatchEvent(new PointerEvent('pointerdown', { clientX: a.x, clientY: a.y, button: 0, buttons: 1, bubbles: true, cancelable: true, pointerId: 1, pointerType: 'mouse' }))
      for (let i = 1; i <= 6; i += 1) {
        window.dispatchEvent(new PointerEvent('pointermove', { clientX: a.x + (b.x - a.x) * i / 6, clientY: a.y, buttons: 1, bubbles: true, pointerId: 1, pointerType: 'mouse', shiftKey: true }))
      }
      window.dispatchEvent(new PointerEvent('pointerup', { clientX: b.x, clientY: b.y, button: 0, bubbles: true, pointerId: 1, pointerType: 'mouse' }))
    }
    const drewLine = await waitOp('add_line')
    check('line tool draws a line on the canvas', drewLine, JSON.stringify(window.__OPS__.slice(-1)))
    await new Promise((r) => setTimeout(r, 900))
    const newLine = (window.__STATE__.shapes || []).filter((s) => s.line).slice(-1)[0]
    check('a line is its own kind, not a connector', newLine && newLine.connector === false,
      JSON.stringify(newLine && { id: newLine.id, conn: newLine.connector, pts: newLine.points }))
    if (newLine) {
      await window.harness.clickShape(newLine.id)
      await new Promise((r) => setTimeout(r, 700))
      check('a selected line shows two end dots', document.querySelectorAll('[data-line-end]').length === 2,
        String(document.querySelectorAll('[data-line-end]').length))
      check('a line gets no dashed shape box',
        document.querySelectorAll('svg rect[stroke="#2F6FBF"]').length === 0,
        String(document.querySelectorAll('svg rect[stroke="#2F6FBF"]').length))
      const geoBox = document.querySelector('.dshv-grid4')
      const geoText = geoBox ? geoBox.textContent.replace(/\s+/g, ' ').trim() : ''
      check('the inspector offers end points, not width/height',
        /X1/.test(geoText) && /Y2/.test(geoText) && !/宽度/.test(geoText),
        geoText.slice(0, 80))
    }

    // ---- 7. connection points are an extra alignment dimension --------------
    {
      const shapes = window.__STATE__.shapes || []
      const plain = shapes.filter((s) => !s.connector && !s.line && s.ports && s.ports.length)
      const a = plain[0]
      const b2 = plain[1]
      const ac = { x: a.bbox.x + a.bbox.w / 2, y: a.bbox.y + a.bbox.h / 2 }
      const bLeft = b2.ports[0][0]
      // aim so one of a's ports lands 0.1in off b's left-port x line
      const wantDx = (bLeft + 0.1) - (a.bbox.x + a.bbox.w / 2)
      const from = px6(ac.x, ac.y)
      const to = { x: from.x + wantDx * scale6, y: from.y }
      const hit = document.elementFromPoint(from.x, from.y)
      hit.dispatchEvent(new PointerEvent('pointerdown', { clientX: from.x, clientY: from.y, button: 0, buttons: 1, bubbles: true, cancelable: true, pointerId: 1, pointerType: 'mouse' }))
      for (let i = 1; i <= 8; i += 1) {
        window.dispatchEvent(new PointerEvent('pointermove', { clientX: from.x + (to.x - from.x) * i / 8, clientY: from.y, buttons: 1, bubbles: true, pointerId: 1, pointerType: 'mouse' }))
      }
      const guide = document.querySelector('#dshv-portguide-x') || document.querySelector('#dshv-portguide-y')
      check('dragging a shape shows a connection-point alignment guide',
        !!guide && guide.style.display !== 'none',
        JSON.stringify(guide && { x1: guide.getAttribute('x1'), x2: guide.getAttribute('x2'), stroke: guide.getAttribute('stroke') }))
      window.dispatchEvent(new PointerEvent('pointerup', { clientX: to.x, clientY: to.y, button: 0, bubbles: true, pointerId: 1, pointerType: 'mouse' }))
      await new Promise((r) => setTimeout(r, 600))
    }

    // ---- 8. drag from a connection dot to connect --------------------------
    {
      const shapes = window.__STATE__.shapes || []
      const plain = shapes.filter((s) => !s.connector && !s.line && s.ports && s.ports.length >= 2)
      const a = plain[0]
      const b2 = plain[plain.length - 1]
      const ac = { x: a.bbox.x + a.bbox.w / 2, y: a.bbox.y + a.bbox.h / 2 }
      const centre = px6(ac.x, ac.y)
      const onShape = document.elementFromPoint(centre.x, centre.y)
      onShape.dispatchEvent(new PointerEvent('pointermove', { clientX: centre.x, clientY: centre.y, bubbles: true, pointerId: 1, pointerType: 'mouse' }))
      await new Promise((r) => setTimeout(r, 250))
      const dot = document.querySelector('.dshv-portDot[data-port="' + a.id + ':1"]')
      check('hovering a shape reveals its connection dots', document.querySelectorAll('.dshv-portDot').length >= 2,
        String(document.querySelectorAll('.dshv-portDot').length))
      if (dot) {
        const db = dot.getBoundingClientRect()
        const df = { x: db.left + db.width / 2, y: db.top + db.height / 2 }
        const bc = { x: b2.bbox.x + b2.bbox.w / 2, y: b2.bbox.y + b2.bbox.h / 2 }
        const dt = px6(bc.x, bc.y)
        window.harness.clearOps()
        const dh = document.elementFromPoint(df.x, df.y)
        dh.dispatchEvent(new PointerEvent('pointerdown', { clientX: df.x, clientY: df.y, button: 0, buttons: 1, bubbles: true, cancelable: true, pointerId: 1, pointerType: 'mouse' }))
        for (let i = 1; i <= 8; i += 1) {
          window.dispatchEvent(new PointerEvent('pointermove', { clientX: df.x + (dt.x - df.x) * i / 8, clientY: df.y + (dt.y - df.y) * i / 8, buttons: 1, bubbles: true, pointerId: 1, pointerType: 'mouse' }))
        }
        window.dispatchEvent(new PointerEvent('pointerup', { clientX: dt.x, clientY: dt.y, button: 0, bubbles: true, pointerId: 1, pointerType: 'mouse' }))
        const connected = await waitOp('connect')
        const cop = lastOp('connect')
        check('dragging from a connection dot creates a connector', connected, JSON.stringify(cop))
        check('the new connector is glued to the two dots',
          !!cop && !!cop.from_port && !!cop.to_port, JSON.stringify(cop && { f: cop.from_port, t: cop.to_port }))
        await new Promise((r) => setTimeout(r, 600))
      }
    }

    // ---- 10. resize + rotate handles on a normal shape ------------------------
    {
      const plain = (window.__STATE__.shapes || []).filter((s) => !s.connector && !s.line)
      // the last shape was never touched by the earlier gestures, so its handles
      // are exactly where its bbox says they are
      const target = plain[plain.length - 1]
      await window.harness.clickShape(target.id)
      await new Promise((r) => setTimeout(r, 700))
      check('a selected shape shows eight scale handles',
        document.querySelectorAll('[data-resize]').length === 8,
        String(document.querySelectorAll('[data-resize]').length))
      check('a selected shape shows a rotate handle',
        document.querySelectorAll('[data-rotate]').length === 1,
        String(document.querySelectorAll('[data-rotate]').length))

      const before = { ...target.bbox }
      const se = document.querySelector('[data-resize="' + target.id + ':se"]')
      if (se) {
        const rb = se.getBoundingClientRect()
        const from = { x: rb.left + rb.width / 2, y: rb.top + rb.height / 2 }
        window.harness.clearOps()
        const el = document.elementFromPoint(from.x, from.y)
        el.dispatchEvent(new PointerEvent('pointerdown', { clientX: from.x, clientY: from.y, button: 0, buttons: 1, bubbles: true, cancelable: true, pointerId: 1, pointerType: 'mouse' }))
        for (let i = 1; i <= 6; i += 1) {
          window.dispatchEvent(new PointerEvent('pointermove', { clientX: from.x + 40 * i / 6, clientY: from.y + 30 * i / 6, buttons: 1, bubbles: true, pointerId: 1, pointerType: 'mouse' }))
        }
        check('resizing previews the new box', !!document.querySelector('#dshv-box-preview'), 'preview')
        window.dispatchEvent(new PointerEvent('pointerup', { clientX: from.x + 40, clientY: from.y + 30, button: 0, bubbles: true, pointerId: 1, pointerType: 'mouse' }))
        await new Promise((r) => setTimeout(r, 900))
        const op = lastOp('move')
        check('dragging a corner handle resizes the shape',
          !!op && op.w > before.w + 0.1 && op.h > before.h + 0.05,
          JSON.stringify(op && { w: op.w, h: op.h, before: { w: before.w, h: before.h } }))
      }

      await window.harness.clickShape(target.id)
      await new Promise((r) => setTimeout(r, 600))
      const rot = document.querySelector('[data-rotate="' + target.id + '"]')
      if (rot) {
        const rb = rot.getBoundingClientRect()
        const from = { x: rb.left + rb.width / 2, y: rb.top + rb.height / 2 }
        window.harness.clearOps()
        const el = document.elementFromPoint(from.x, from.y)
        el.dispatchEvent(new PointerEvent('pointerdown', { clientX: from.x, clientY: from.y, button: 0, buttons: 1, bubbles: true, cancelable: true, pointerId: 1, pointerType: 'mouse' }))
        for (let i = 1; i <= 6; i += 1) {
          window.dispatchEvent(new PointerEvent('pointermove', { clientX: from.x + 70 * i / 6, clientY: from.y + 50 * i / 6, buttons: 1, bubbles: true, pointerId: 1, pointerType: 'mouse' }))
        }
        window.dispatchEvent(new PointerEvent('pointerup', { clientX: from.x + 70, clientY: from.y + 50, button: 0, bubbles: true, pointerId: 1, pointerType: 'mouse' }))
        await new Promise((r) => setTimeout(r, 900))
        const op = lastOp('move')
        check('dragging the rotate handle sets an angle',
          !!op && typeof op.angle === 'number' && Math.abs(op.angle) > 5,
          JSON.stringify(op && { angle: op.angle }))
        check('the rotated shape is painted rotated',
          /rotate\(/.test(String(document.querySelector('[data-shape-id="' + target.id + '"]').getAttribute('transform'))),
          String(document.querySelector('[data-shape-id="' + target.id + '"]').getAttribute('transform')))
      }
    }

    // ---- 9. the grid must scale with the page, not with a pixel constant ----
    {
      const page = document.querySelector('.dshv-page')
      const cells = () => {
        const cs = getComputedStyle(page)
        const unit = parseFloat((cs.backgroundSize || '').split(',')[0])
        const w = page.getBoundingClientRect().width
        return { unit: Math.round(unit * 100) / 100, w: Math.round(w), cells: w / unit }
      }
      const expect = (window.__STATE__.pageSize.w || 11) / 0.25
      const before = cells()
      const zin = Array.from(document.querySelectorAll('.dshv-zbtn')).find((b) => b.textContent === '+')
      zin.click(); zin.click()
      await new Promise((r) => setTimeout(r, 800))
      const after = cells()
      check('grid cells stay a fixed fraction of the page when zooming',
        Math.abs(before.cells - after.cells) < 0.3 && Math.abs(after.cells - expect) < 1.5,
        JSON.stringify({ before, after, expect }))
      const zout = Array.from(document.querySelectorAll('.dshv-zbtn')).find((b) => b.textContent === '\u2212')
      zout.click(); zout.click()
      await new Promise((r) => setTimeout(r, 600))
    }

    // ---- 5. the zoom toolbar must stay a thin bar and keep off the handles --
    // A handle only matters where it can actually be hit: the scroller clips
    // anything past its edge, so intersect with the visible canvas rect first.
    const zoomBox = document.querySelector('.dshv-zoom').getBoundingClientRect()
    const wrapBox = document.querySelector('.dshv-canvasWrap').getBoundingClientRect()
    const handles = Array.from(document.querySelectorAll('[data-route-end], [data-route-handle]'))
    const visible = (b) => ({
      left: Math.max(b.left, wrapBox.left), right: Math.min(b.right, wrapBox.right),
      top: Math.max(b.top, wrapBox.top), bottom: Math.min(b.bottom, wrapBox.bottom),
    })
    const covered = handles.filter((el) => {
      const b = visible(el.getBoundingClientRect())
      return b.right > b.left && b.bottom > b.top
        && Math.min(zoomBox.right, b.right) - Math.max(zoomBox.left, b.left) > 0
        && Math.min(zoomBox.bottom, b.bottom) - Math.max(zoomBox.top, b.top) > 0
    })
    check('zoom toolbar does not cover a visible end or segment handle', covered.length === 0,
      covered.length + ' covered; zoom=' + JSON.stringify(zoomBox.toJSON()) + ' wrap=' + JSON.stringify(wrapBox.toJSON()))
    check('zoom toolbar is a thin bar, not a full-height column', zoomBox.height < 80, zoomBox.height)
  } catch (error) {
    results.push({ name: 'spec crashed', ok: false, detail: error.message + '\n' + (error.stack || '') })
  }
  window.__SPEC__ = results
  const box = document.getElementById('log')
  if (box) {
    box.textContent = results.map((r) => (r.ok ? 'PASS ' : 'FAIL ') + r.name + (r.ok ? '' : ' :: ' + r.detail)).join('\n')
    box.style.maxHeight = '70vh'
  }
  return results
}

window.harness = {
  logs: () => window.__LOGS__,
  ops: () => window.__OPS__,
  clearOps: () => { window.__OPS__.length = 0 },
  doc: () => window.__docState__,
  svgHost: () => document.querySelector('.dshv-svgHost'),
  svg: () => document.querySelector('.dshv-svgHost svg'),
  counts: () => ({
    ends: document.querySelectorAll('[data-route-end]').length,
    bands: document.querySelectorAll('[data-route-band]').length,
    dots: document.querySelectorAll('[data-route-handle]').length,
    shapes: document.querySelectorAll('[data-shape-id]').length,
  }),
  /** what elementFromPoint finds at a viewport point */
  hitAt: (x, y) => {
    const el = document.elementFromPoint(x, y)
    if (!el) return { el: null }
    const tags = ['[data-route-end]', '[data-route-band]', '[data-route-handle]', '[data-guide]', '[data-shape-id]']
    const hit = {}
    for (const sel of tags) hit[sel] = !!el.closest(sel)
    return { tag: el.tagName, attrs: Array.from(el.attributes).map((a) => a.name + '=' + a.value).join(' '), hit }
  },
  /** centre of the first matching element, in viewport coordinates */
  centreOf: (selector, index = 0) => {
    const el = document.querySelectorAll(selector)[index]
    if (!el) return null
    const r = el.getBoundingClientRect()
    return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height, left: r.left, top: r.top }
  },
  /** where the code believes a point is: svg box + viewBox scale */
  probe: () => {
    const svg = window.harness.svg()
    const box = svg.getBoundingClientRect()
    const vb = svg.viewBox.baseVal
    return { box: { left: box.left, top: box.top, w: box.width, h: box.height },
      vb: { x: vb.x, y: vb.y, w: vb.width, h: vb.height }, scale: box.width / vb.width }
  },
  drag: async (x1, y1, x2, y2, steps = 8) => {
    const target = document.elementFromPoint(x1, y1)
    if (!target) return 'no target'
    target.dispatchEvent(new PointerEvent('pointerdown', { clientX: x1, clientY: y1, button: 0, buttons: 1, bubbles: true, cancelable: true, pointerId: 1, pointerType: 'mouse' }))
    for (let i = 1; i <= steps; i += 1) {
      const x = x1 + (x2 - x1) * i / steps
      const y = y1 + (y2 - y1) * i / steps
      window.dispatchEvent(new PointerEvent('pointermove', { clientX: x, clientY: y, buttons: 1, bubbles: true, pointerId: 1, pointerType: 'mouse' }))
      await new Promise((r) => setTimeout(r, 0))
    }
    window.dispatchEvent(new PointerEvent('pointerup', { clientX: x2, clientY: y2, button: 0, buttons: 0, bubbles: true, pointerId: 1, pointerType: 'mouse' }))
    await new Promise((r) => setTimeout(r, 250))
    return 'ok'
  },
  /** Drag and report the tooltip seen at the middle of the gesture (no awaits in between). */
  dragProbe: (x1, y1, x2, y2, steps = 6) => {
    const target = document.elementFromPoint(x1, y1)
    if (!target) return { error: 'no target' }
    const tips = []
    const tip = () => document.querySelector('.dshv-dragtip')
    target.dispatchEvent(new PointerEvent('pointerdown', { clientX: x1, clientY: y1, button: 0, buttons: 1, bubbles: true, cancelable: true, pointerId: 1, pointerType: 'mouse' }))
    for (let i = 1; i <= steps; i += 1) {
      const x = x1 + (x2 - x1) * i / steps
      const y = y1 + (y2 - y1) * i / steps
      window.dispatchEvent(new PointerEvent('pointermove', { clientX: x, clientY: y, buttons: 1, bubbles: true, pointerId: 1, pointerType: 'mouse' }))
      const el = tip()
      tips.push(el ? { text: el.textContent, display: el.style.display } : null)
    }
    window.dispatchEvent(new PointerEvent('pointerup', { clientX: x2, clientY: y2, button: 0, buttons: 0, bubbles: true, pointerId: 1, pointerType: 'mouse' }))
    return { tips, ops: window.__OPS__.slice(-4).map((o) => o.action + ':' + JSON.stringify(o)) }
  },
  clickShape: async (id) => {
    const el = document.querySelector('[data-shape-id="' + id + '"]')
    if (!el) return 'no shape'
    const r = el.getBoundingClientRect()
    const x = r.left + r.width / 2
    const y = r.top + r.height / 2
    el.dispatchEvent(new PointerEvent('pointerdown', { clientX: x, clientY: y, button: 0, buttons: 1, bubbles: true, cancelable: true, pointerId: 1, pointerType: 'mouse' }))
    window.dispatchEvent(new PointerEvent('pointerup', { clientX: x, clientY: y, button: 0, bubbles: true, pointerId: 1, pointerType: 'mouse' }))
    el.dispatchEvent(new MouseEvent('click', { clientX: x, clientY: y, bubbles: true, cancelable: true }))
    await new Promise((r) => setTimeout(r, 400))
    return { x, y }
  },
  tooltip: () => { const el = document.querySelector('.dshv-dragtip'); return el ? { text: el.textContent, display: el.style.display } : null },
  /**
   * Drag a connector end onto a port and prove the green marker, the tooltip and
   * the committed coordinates all name the same point (what you see is what lands).
   */
  markerDrop: async (shapeId, endIndex, toShapeId, portIndex) => {
    await window.harness.clickShape(shapeId)
    await new Promise((r) => setTimeout(r, 600))
    const ends = document.querySelectorAll('[data-route-end]')
    // an end handle is a round dot now, but stay compatible with the old square
    const dot = ends[endIndex]
      && (ends[endIndex].querySelector('circle') || ends[endIndex].querySelector('rect'))
    if (!dot) return { error: 'no end handle' }
    const rb = dot.getBoundingClientRect()
    const from = { x: rb.left + rb.width / 2, y: rb.top + rb.height / 2 }
    const svg = window.harness.svg()
    const box = svg.getBoundingClientRect()
    const vb = svg.viewBox.baseVal
    const scale = box.width / vb.width
    const pageH = window.harness.pageH()
    const toPx = (sx, sy) => ({
      x: box.left + (sx - vb.x) * scale,
      y: box.top + ((pageH - sy) - vb.y) * scale,
    })
    const port = window.harness.portOf(toShapeId, portIndex)
    const target = toPx(port[0], port[1])
    window.harness.clearOps()
    const el = document.elementFromPoint(from.x, from.y)
    if (!el) return { error: 'no hit target' }
    el.dispatchEvent(new PointerEvent('pointerdown', { clientX: from.x, clientY: from.y, button: 0, buttons: 1, bubbles: true, cancelable: true, pointerId: 1, pointerType: 'mouse' }))
    for (let i = 1; i <= 8; i += 1) {
      window.dispatchEvent(new PointerEvent('pointermove', {
        clientX: from.x + (target.x - from.x) * i / 8,
        clientY: from.y + (target.y - from.y) * i / 8,
        buttons: 1, bubbles: true, pointerId: 1, pointerType: 'mouse',
      }))
    }
    const circle = document.querySelector('#dshv-drop circle')
    // cy is an svg coordinate (y grows downwards); the commit is in sheet space
    const markerSheet = circle
      ? [Number(circle.getAttribute('cx')), pageH - Number(circle.getAttribute('cy'))]
      : null
    const tip = window.harness.tooltip()
    window.dispatchEvent(new PointerEvent('pointerup', { clientX: target.x, clientY: target.y, button: 0, bubbles: true, pointerId: 1, pointerType: 'mouse' }))
    await new Promise((r) => setTimeout(r, 800))
    const op = window.__OPS__.filter((o) => o.action === 'reglue').slice(-1)[0]
    const committed = op ? [op.x, op.y] : null
    const afterEnds = document.querySelectorAll('[data-route-end]')
    const ar = afterEnds[endIndex]
      && (afterEnds[endIndex].querySelector('circle') || afterEnds[endIndex].querySelector('rect'))
    let landed = null
    if (ar) {
      const b2 = ar.getBoundingClientRect()
      landed = [
        vb.x + (b2.left + b2.width / 2 - box.left) / scale,
        pageH - vb.y - (b2.top + b2.height / 2 - box.top) / scale,
      ]
    }
    const close = (a, b, tol) => !!a && !!b && Math.abs(a[0] - b[0]) < tol && Math.abs(a[1] - b[1]) < tol
    return {
      port, marker: markerSheet, committed, landed, tip: tip && tip.text,
      markerMatchesCommit: close(markerSheet, committed, 0.02),
      landedOnMarker: close(landed, markerSheet, 0.02),
    }
  },
  /** Clear a hand-drawn route so the connector falls back to the router. */
  resetRoute: async (id) => {
    const st = window.__STATE__
    if (!st) return false
    await fetch('/dsh-visio/op', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ action: 'clear_route', path: st.path, page: st.page || 1, shape_id: id }),
    })
    await new Promise((r) => setTimeout(r, 500))
    return true
  },
  pageH: () => {
    const st = window.__STATE__
    if (st && st.pageSize) return st.pageSize.h
    const rect = window.harness.svg().querySelector('rect')
    return Number(rect && rect.getAttribute('height'))
  },
  portOf: (id, index) => {
    const st = window.__STATE__
    const shape = st && (st.shapes || []).find((s) => s.id === id)
    if (shape && shape.ports && shape.ports[index]) return shape.ports[index]
    return null
  },
}
</script>
