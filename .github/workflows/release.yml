name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.15.3)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: python -m pip install --upgrade pip pillow

      - name: Verify tests before publishing
        run: |
          python tests/test_engine.py
          node tests/test_client_render.mjs
          node tests/test_client_contract.mjs

      - name: Read version
        id: version
        run: |
          echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "v${{ steps.version.outputs.value }}" = "${GITHUB_REF#refs/tags/}" \
            || { echo "tag does not match package.json version"; exit 1; }

      - name: Build bundle
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=dsh-visio/ -o "dist/dsh-visio-${{ steps.version.outputs.value }}.zip" HEAD

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: dsh-visio v${{ steps.version.outputs.value }}
          body_path: CHANGELOG.md
          files: dist/*.zip
          draft: false
          prerelease: false
