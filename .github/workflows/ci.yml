name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: python -m pip install --upgrade pip pillow

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          python -m py_compile engine/vsdx_core.py engine/visio_bridge.py engine/blank_doc.py engine/stencil.py engine/svg_raster.py

      - name: Engine tests
        run: python tests/test_engine.py

      - name: Client contract tests
        run: |
          node tests/test_client_render.mjs
          node tests/test_client_contract.mjs

      - name: Host contract test
        run: node tests/test_host_contract.mjs
        env:
          DSH_VISIO_PYTHON: python

  package:
    name: Build bundle
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Pack plugin
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=dsh-visio/ -o dist/dsh-visio-${{ github.sha }}.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-visio-bundle
          path: dist/*.zip
          retention-days: 14
